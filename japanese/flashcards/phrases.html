<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Japanese Phrase Decks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --border: #1f2937;
      --accent: #38bdf8;
      --accent-dark: #0ea5e9;
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
      background: radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08), transparent 40%),
        radial-gradient(circle at 90% 5%, rgba(14, 165, 233, 0.12), transparent 35%),
        var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 32px 16px 48px;
      min-height: 100vh;
    }

    .app {
      width: min(980px, 100%);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
    }

    .controls label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .controls select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      min-width: 180px;
      background: #0b1220;
      color: var(--ink);
    }

    .pill {
      background: rgba(56, 189, 248, 0.15);
      color: #bae6fd;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .phrase {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .reveal-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .reveal-card {
      background: #0b1220;
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 120px;
    }

    .reveal-label {
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 700;
    }

    .reveal-value {
      font-size: 1.2rem;
      font-weight: 600;
      color: transparent;
      transition: color 0.2s ease;
    }

    .reveal-value.revealed {
      color: var(--ink);
    }

    .reveal-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .rate-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      color: #0b1220;
    }

    .rate-btn.again { background: #f87171; }
    .rate-btn.hard { background: #fbbf24; }
    .rate-btn.good { background: #34d399; }
    .rate-btn.easy { background: #60a5fa; }

    .footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .speak-btn {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #0b1220;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Japanese Phrase Decks</h1>
      <p>Hardcoded practice phrases split into 5-card decks (50 total).</p>
    </header>

    <section class="controls">
      <div>
        <label for="deckSelect">Deck</label>
        <select id="deckSelect"></select>
      </div>
      <div class="pill" id="deckLabel">Deck 1</div>
      <div class="pill" id="deckProgress">1 / 50</div>
      <button class="speak-btn" id="speakBtn" type="button">🔊 Speak</button>
    </section>

    <section class="card">
      <div class="phrase" id="japanesePhrase">こんにちは</div>
      <div class="reveal-grid">
        <div class="reveal-card">
          <div class="reveal-label">Romaji</div>
          <div class="reveal-value" id="romajiValue">konnichiwa</div>
          <button class="reveal-btn" data-reveal="romaji" type="button">Reveal</button>
        </div>
        <div class="reveal-card">
          <div class="reveal-label">English</div>
          <div class="reveal-value" id="englishValue">Hello.</div>
          <button class="reveal-btn" data-reveal="english" type="button">Reveal</button>
        </div>
      </div>

      <div class="actions">
        <button class="rate-btn again" data-rating="again" type="button">Again</button>
        <button class="rate-btn hard" data-rating="hard" type="button">Hard</button>
        <button class="rate-btn good" data-rating="good" type="button">Good</button>
        <button class="rate-btn easy" data-rating="easy" type="button">Easy</button>
      </div>

      <div class="footer">
        <div id="statusText">0 completed, 50 in review.</div>
        <div id="queueCount">Cards left: 50</div>
      </div>
    </section>
  </div>

  <script>
    const DECK_SIZE = 5;
    const PHRASES = [
      { japanese: "こんにちは。", romaji: "konnichiwa.", english: "Hello." },
      { japanese: "おはようございます。", romaji: "ohayou gozaimasu.", english: "Good morning." },
      { japanese: "こんばんは。", romaji: "konbanwa.", english: "Good evening." },
      { japanese: "おやすみなさい。", romaji: "oyasuminasai.", english: "Good night." },
      { japanese: "ありがとう。", romaji: "arigatou.", english: "Thank you." },
      { japanese: "すみません。", romaji: "sumimasen.", english: "Excuse me." },
      { japanese: "ごめんなさい。", romaji: "gomennasai.", english: "Sorry." },
      { japanese: "はい、そうです。", romaji: "hai, sou desu.", english: "Yes, it is." },
      { japanese: "いいえ、ちがいます。", romaji: "iie, chigaimasu.", english: "No, it's different." },
      { japanese: "おねがいします。", romaji: "onegaishimasu.", english: "Please." },
      { japanese: "げんきですか。", romaji: "genki desu ka.", english: "How are you?" },
      { japanese: "げんきです。", romaji: "genki desu.", english: "I'm fine." },
      { japanese: "なまえはなんですか。", romaji: "namae wa nan desu ka.", english: "What is your name?" },
      { japanese: "わたしはあんなです。", romaji: "watashi wa anna desu.", english: "I am Anna." },
      { japanese: "はじめまして。", romaji: "hajimemashite.", english: "Nice to meet you." },
      { japanese: "どこからきましたか。", romaji: "doko kara kimashita ka.", english: "Where are you from?" },
      { japanese: "あめりかからきました。", romaji: "amerika kara kimashita.", english: "I am from America." },
      { japanese: "にほんごをべんきょうします。", romaji: "nihongo o benkyou shimasu.", english: "I study Japanese." },
      { japanese: "えいごをはなします。", romaji: "eigo o hanashimasu.", english: "I speak English." },
      { japanese: "にほんごはすこしです。", romaji: "nihongo wa sukoshi desu.", english: "My Japanese is a little." },
      { japanese: "これはなんですか。", romaji: "kore wa nan desu ka.", english: "What is this?" },
      { japanese: "それはわたしのです。", romaji: "sore wa watashi no desu.", english: "That is mine." },
      { japanese: "これはほんです。", romaji: "kore wa hon desu.", english: "This is a book." },
      { japanese: "あれはねこです。", romaji: "are wa neko desu.", english: "That is a cat." },
      { japanese: "みずをください。", romaji: "mizu o kudasai.", english: "Water, please." },
      { japanese: "ぱんをください。", romaji: "pan o kudasai.", english: "Bread, please." },
      { japanese: "こーひーをください。", romaji: "koohii o kudasai.", english: "Coffee, please." },
      { japanese: "といれはどこですか。", romaji: "toire wa doko desu ka.", english: "Where is the restroom?" },
      { japanese: "ここにすわっていいですか。", romaji: "koko ni suwatte ii desu ka.", english: "May I sit here?" },
      { japanese: "ちょっとまってください。", romaji: "chotto matte kudasai.", english: "Please wait." },
      { japanese: "わかりません。", romaji: "wakarimasen.", english: "I don't understand." },
      { japanese: "もういちどおねがいします。", romaji: "mou ichido onegaishimasu.", english: "One more time, please." },
      { japanese: "ゆっくりはなしてください。", romaji: "yukkuri hanashite kudasai.", english: "Please speak slowly." },
      { japanese: "だいじょうぶです。", romaji: "daijoubu desu.", english: "It's okay." },
      { japanese: "たすけてください。", romaji: "tasukete kudasai.", english: "Please help." },
      { japanese: "みちにまよいました。", romaji: "michi ni mayoimashita.", english: "I am lost." },
      { japanese: "えきはどこですか。", romaji: "eki wa doko desu ka.", english: "Where is the station?" },
      { japanese: "みぎにいってください。", romaji: "migi ni itte kudasai.", english: "Please go right." },
      { japanese: "ひだりにいってください。", romaji: "hidari ni itte kudasai.", english: "Please go left." },
      { japanese: "まっすぐいってください。", romaji: "massugu itte kudasai.", english: "Please go straight." },
      { japanese: "いまなんじですか。", romaji: "ima nanji desu ka.", english: "What time is it?" },
      { japanese: "きょうはげつようびです。", romaji: "kyou wa getsuyoubi desu.", english: "Today is Monday." },
      { japanese: "あしたはやすみです。", romaji: "ashita wa yasumi desu.", english: "I am off tomorrow." },
      { japanese: "わたしはがくせいです。", romaji: "watashi wa gakusei desu.", english: "I am a student." },
      { japanese: "しごとにいきます。", romaji: "shigoto ni ikimasu.", english: "I go to work." },
      { japanese: "がっこうへいきます。", romaji: "gakkou e ikimasu.", english: "I go to school." },
      { japanese: "いえにかえります。", romaji: "ie ni kaerimasu.", english: "I go home." },
      { japanese: "えいがをみます。", romaji: "eiga o mimasu.", english: "I watch movies." },
      { japanese: "おんがくをききます。", romaji: "ongaku o kikimasu.", english: "I listen to music." },
      { japanese: "ほんをよみます。", romaji: "hon o yomimasu.", english: "I read books." }
    ];

    const els = {
      deckSelect: document.getElementById("deckSelect"),
      deckLabel: document.getElementById("deckLabel"),
      deckProgress: document.getElementById("deckProgress"),
      statusText: document.getElementById("statusText"),
      queueCount: document.getElementById("queueCount"),
      japanesePhrase: document.getElementById("japanesePhrase"),
      romajiValue: document.getElementById("romajiValue"),
      englishValue: document.getElementById("englishValue"),
      speakBtn: document.getElementById("speakBtn"),
      revealButtons: Array.from(document.querySelectorAll(".reveal-btn")),
      ratingButtons: Array.from(document.querySelectorAll(".rate-btn"))
    };

    const synth = window.speechSynthesis;
    let voice = null;

    const state = {
      decks: [],
      deckIndex: 0,
      queue: [],
      finished: []
    };

    function buildDecks(entries) {
      const decks = [];
      for (let i = 0; i < entries.length; i += DECK_SIZE) {
        const slice = entries.slice(i, i + DECK_SIZE);
        decks.push({
          label: `Deck ${decks.length + 1} (${slice.length})`,
          entries: slice
        });
      }
      return decks;
    }

    function refreshDeckSelect() {
      els.deckSelect.innerHTML = "";
      state.decks.forEach((deck, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = deck.label;
        els.deckSelect.appendChild(option);
      });
      els.deckSelect.value = String(state.deckIndex);
    }

    function setDeck(index) {
      state.deckIndex = Math.max(0, Math.min(index, state.decks.length - 1));
      const deck = state.decks[state.deckIndex];
      state.queue = deck ? [...deck.entries] : [];
      state.finished = [];
      els.deckLabel.textContent = deck ? deck.label : "No deck";
      renderCard();
    }

    function updateProgress() {
      const total = state.queue.length + state.finished.length;
      const completed = state.finished.length;
      const current = total ? Math.min(completed + 1, total) : 0;
      els.deckProgress.textContent = `${current} / ${total}`;
      els.statusText.textContent = total
        ? `${completed} completed, ${state.queue.length} in review.`
        : "No phrases available.";
      els.queueCount.textContent = `Cards left: ${state.queue.length}`;
    }

    function resetReveals() {
      els.romajiValue.classList.remove("revealed");
      els.englishValue.classList.remove("revealed");
      els.revealButtons.forEach((btn) => {
        btn.textContent = "Reveal";
      });
    }

    function renderCard() {
      const current = state.queue[0];
      if (!current) {
        els.japanesePhrase.textContent = "All done!";
        els.romajiValue.textContent = "";
        els.englishValue.textContent = "";
        resetReveals();
        updateProgress();
        return;
      }

      els.japanesePhrase.textContent = current.japanese;
      els.romajiValue.textContent = current.romaji;
      els.englishValue.textContent = current.english;
      resetReveals();
      updateProgress();
    }

    function applyRating(rating) {
      if (!state.queue.length) return;
      const card = state.queue.shift();
      if (rating === "easy") {
        state.finished.push(card);
      } else {
        const insertMap = { again: 2, hard: 5, good: 10 };
        const offset = insertMap[rating] ?? 3;
        const index = Math.min(offset, state.queue.length);
        state.queue.splice(index, 0, card);
      }
      renderCard();
    }

    function loadVoices() {
      const voices = synth.getVoices();
      voice =
        voices.find((v) => v.lang.toLowerCase().startsWith("ja")) ||
        voices.find((v) => v.lang.toLowerCase().includes("ja")) ||
        null;
    }

    function speak(text) {
      if (!text) return;
      loadVoices();
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ja-JP";
      if (voice) utter.voice = voice;
      synth.speak(utter);
    }

    els.revealButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const target = btn.dataset.reveal === "romaji" ? els.romajiValue : els.englishValue;
        target.classList.toggle("revealed");
        btn.textContent = target.classList.contains("revealed") ? "Hide" : "Reveal";
      });
    });

    els.ratingButtons.forEach((btn) => {
      btn.addEventListener("click", () => applyRating(btn.dataset.rating));
    });

    els.deckSelect.addEventListener("change", (event) => {
      setDeck(Number(event.target.value));
    });

    els.speakBtn.addEventListener("click", () => {
      const current = state.queue[0];
      if (current) speak(current.japanese);
    });

    synth.onvoiceschanged = loadVoices;
    loadVoices();

    state.decks = buildDecks(PHRASES);
    refreshDeckSelect();
    setDeck(0);
  </script>
</body>
</html>
